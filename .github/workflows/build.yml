name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tectonic
        run: |
          curl -sL -o tectonic.tar.gz "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf tectonic.tar.gz
          chmod +x tectonic
          sudo mv tectonic /usr/local/bin/tectonic

      # tectonic fetches its TeXLive package bundle from a shared CDN
      # (relay.fullyjustified.net) on first use; that CDN occasionally
      # 429s shared CI-runner IP ranges. Caching ~/.cache/tectonic across
      # runs means only a cache-miss run ever touches the network, and the
      # retry loop below covers that first run if it gets unlucky.
      - name: Cache tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/tectonic
          key: tectonic-bundle-0.17.0

      - name: Compile cv.tex
        run: |
          for attempt in 1 2 3 4 5; do
            if tectonic cv.tex; then
              exit 0
            fi
            echo "tectonic compile failed (attempt $attempt/5), retrying after backoff..."
            sleep $((attempt * 15))
          done
          echo "::error::tectonic compile failed after 5 attempts"
          exit 1

      - name: Enforce one-page limit
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pages=$(pdfinfo cv.pdf | awk '/^Pages:/ {print $2}')
          echo "cv.pdf has $pages page(s)"
          if [ "$pages" -ne 1 ]; then
            echo "::error::cv.pdf is $pages pages, expected exactly 1"
            exit 1
          fi

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv.pdf
